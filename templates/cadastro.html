<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Mapa da Cidade</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/cadastro.css') }}"
    >
</head>

<body>

    <main class="cadastro">

        <div class="cadastro-card">

            <h1>
                Criar conta
            </h1>

            <p>
                Crie sua conta para acompanhar suas solicitações.
            </p>

            <form action="/cadastro" method="POST">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >


                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    required
                >


                <button type="submit">
                    Criar conta
                </button>

            </form>

            <p class="login-link">
                Já possui uma conta?
                <a href="/login">
                    Entrar
                </a>
            </p>

        </div>

    </main>

</body>

</html>

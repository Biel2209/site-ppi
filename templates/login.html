<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - Mapa da Cidade</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}"
    >
</head>

<body>

    <main class="login">

        <div class="login-card">

            <h1>
                Entrar
            </h1>

            <p>
                Entre na sua conta para acompanhar suas solicitações.
            </p>

            <form action="/login" method="POST">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p class="cadastro-link">
                Ainda não possui uma conta?
                <a href="/cadastro">
                    Criar conta
                </a>
            </p>

        </div>

    </main>

</body>

</html>
